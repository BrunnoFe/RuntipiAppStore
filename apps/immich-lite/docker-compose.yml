services:
  immich-lite:
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - DB_HOSTNAME=immich-db
      - DB_USERNAME=tipi
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - JWT_SECRET=${JWT_SECRET}
      - IMMICH_MACHINE_LEARNING_ENABLED=false
      - IMMICH_METRICS=false
      - ENABLE_MAPBOX=false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    devices:
      - /dev/dri:/dev/dri
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      immich-lite_personal-store_network:
        gw_priority: 0
      tipi_main_network:
        gw_priority: 1
    ports:
      - ${APP_PORT}:2283
    labels:
      generated: true
      traefik.enable: true
      traefik.docker.network: runtipi_tipi_main_network
      
      # --- DEFINIÇÃO DO MIDDLEWARE DE REDIRECIONAMENTO (SÓ REDIRECIONA) ---
      traefik.http.middlewares.immich-lite-personal-store-web-redirect.redirectscheme.scheme: https
      
      # --- DEFINIÇÃO DO NOVO MIDDLEWARE DE LIMITES (SÓ LIBERA O BUFFER) ---
      traefik.http.middlewares.immich-no-limits.buffering.maxRequestBodyBytes: "0"
      traefik.http.middlewares.immich-no-limits.buffering.memRequestBodyBytes: "0"
      traefik.http.middlewares.immich-no-limits.buffering.maxResponseBodyBytes: "0"
      traefik.http.middlewares.immich-no-limits.buffering.retryExpression: "IsNetworkError() && Attempts() <= 2"

      # --- ROTEADOR PÚBLICO (Cloudflare/Inseguro) ---
      traefik.http.services.immich-lite-personal-store.loadbalancer.server.port: "2283"
      traefik.http.routers.immich-lite-personal-store-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.immich-lite-personal-store-insecure.entrypoints: web
      traefik.http.routers.immich-lite-personal-store-insecure.service: immich-lite-personal-store
      traefik.http.routers.immich-lite-personal-store-insecure.middlewares: immich-lite-personal-store-web-redirect
      
      # --- ROTEADOR PÚBLICO (Cloudflare/Seguro) ---
      traefik.http.routers.immich-lite-personal-store.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.immich-lite-personal-store.entrypoints: websecure
      traefik.http.routers.immich-lite-personal-store.service: immich-lite-personal-store
      traefik.http.routers.immich-lite-personal-store.tls.certresolver: myresolver
      # Adicionamos o no-limits aqui também para garantir uploads via web externa se o tunnel permitir
      traefik.http.routers.immich-lite-personal-store.middlewares: immich-no-limits

      # --- ROTEADOR LOCAL (Porta 80 - HTTP) ---
      traefik.http.routers.immich-lite-personal-store-local-insecure.rule: Host(`fotos.${LOCAL_DOMAIN}`)
      traefik.http.routers.immich-lite-personal-store-local-insecure.entrypoints: web
      traefik.http.routers.immich-lite-personal-store-local-insecure.service: immich-lite-personal-store
      # AQUI MANTÉM O REDIRECT (Quem entra HTTP vai pra HTTPS)
      traefik.http.routers.immich-lite-personal-store-local-insecure.middlewares: immich-lite-personal-store-web-redirect

      # --- ROTEADOR LOCAL (Porta 443 - HTTPS) ---
      traefik.http.routers.immich-lite-personal-store-local.rule: Host(`fotos.${LOCAL_DOMAIN}`)
      traefik.http.routers.immich-lite-personal-store-local.entrypoints: websecure
      traefik.http.routers.immich-lite-personal-store-local.service: immich-lite-personal-store
      traefik.http.routers.immich-lite-personal-store-local.tls: true
      
      traefik.http.routers.immich-lite-personal-store-local.middlewares: immich-no-limits

      # --- RUNTIPI MANAGED ---
      runtipi.managed: true
      runtipi.appurn: immich-lite:personal-store
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=tipi
      - POSTGRES_DB=immich
      - PG_DATA=/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      immich-lite_personal-store_network:
        gw_priority: 0
    labels:
      runtipi.managed: "true"
      runtipi.appurn: immich-lite:personal-store
  immich-redis:
    image: redis:6.2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      immich-lite_personal-store_network:
        gw_priority: 0
    labels:
      runtipi.managed: "true"
      runtipi.appurn: immich-lite:personal-store
networks:
  tipi_main_network:
    name: runtipi_tipi_main_network
    external: true
  immich-lite_personal-store_network:
    ipam:
      config:
        - subnet: 10.128.22.0/24

